# Reads .env twice, in two different ways:
#   * `env_file: .env` injects every line VERBATIM into the web container --
#     no ${VAR} expansion. Write full values in .env, never interpolations.
#   * `${VAR}` below is expanded by docker compose itself from .env / the shell.
#
# .env.example is the source of truth for variable names. The app reads
# API_KEYS (comma-separated) via app/core/config.py;
# REDIS_PASSWORD are consumed here and ignored by the app.
services:
  web:
    build: .
    container_name: headwater_app
    env_file: .env
    environment:
      # `environment:` overrides `env_file:`, so container-only hostnames live
      # HERE rather than in .env.example. Putting `redis:6379` in the example
      # file made `cp .env.example .env && uvicorn main:app` return 503 on
      # every request: the hostname only resolves inside this compose network,
      # and the rate limiter correctly fails closed when its backend is
      # unreachable. The example file now stays runnable standalone.
      REDIS_URL: "redis://:${REDIS_PASSWORD:-changeme}@redis:6379"
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G  # Increased for Playwright browser
        reservations:
          cpus: '0.5'
          memory: 512M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: headwater_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme} --appendonly yes
    volumes:
      - redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-changeme}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  redis_data:
