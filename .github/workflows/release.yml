# .github/workflows/release.yml
#
# HOW THE BROKEN TRIGGER WAS FIXED (CRT-6)
# ----------------------------------------
# Before: two jobs in one workflow, gated on the actor.
#
#     bump-version:  if: github.actor != 'github-actions[bot]'   # ran
#     release:       if: github.actor == 'github-actions[bot]'   # never ran
#
# The `release` job was waiting for the workflow to be re-triggered by the
# commit that `bump-version` pushed. But `bump-version` pushed with the default
# GITHUB_TOKEN, and GitHub deliberately does not trigger workflow runs from
# pushes made with GITHUB_TOKEN (loop protection). So the second run never
# happened and `release` had not executed since v1.5.1 (2025-09-16). Docker Hub
# `latest` and `1.6.0` were pushed by hand, unsigned.
#
# After: ONE run, sequential jobs joined by `needs`. No second trigger is
# required, so no token can withhold it.
#
#     verify  ->  tag-release  ->  publish
#
# WHY NOTHING HERE COMMITS TO main
# --------------------------------
# `main` is protected by a repository ruleset with NO bypass actors: every
# change reaches it through a pull request with passing CI. That applies to
# GITHUB_TOKEN and to a maintainer PAT alike, so a job that pushes a version
# commit to main cannot work, whatever credential it holds.
#
# So the version is no longer bumped by CI. `app/__version__.py` is edited in a
# pull request like any other file, which makes the version an explicit,
# reviewed decision rather than an automatic patch bump. When main carries a
# version that has no matching tag, `tag-release` creates it. Tags are outside
# the branch ruleset, so pushing one is permitted.
#
# Publishing does NOT depend on that tag firing a workflow -- it depends on
# `needs`, in the same run. That is what keeps a token from withholding it.
#
# TRADE-OFF vs. the alternatives:
#   * PAT in a secret - no longer helps: with no bypass actors, a ruleset
#     applies to a human PAT exactly as it applies to GITHUB_TOKEN.
#   * Bypass actor for the Actions app - not available on a user-owned repo;
#     GitHub requires the app to belong to an owning organisation.
#   * Auto-bump via a PR opened by CI - possible, but it makes every release a
#     two-merge dance for no real gain over editing the version in the PR that
#     is being released.
#   * CHOSEN: version lives in main, CI only tags it. Zero secrets, zero
#     bypasses, and the release is gated on the same CI everything else is.
name: Release

on:
  push:
    branches: [ main ]
  # Manual re-run, e.g. to republish after a registry outage.
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Same gates a pull request gets. Nothing is bumped or published unless lint,
  # the full pytest suite (with the coverage floor), the boot check and the
  # docker health check all pass.
  verify:
    name: Verify
    uses: ./.github/workflows/_verify.yml
    permissions:
      contents: read

  tag-release:
    name: Tag Release
    needs: [ verify ]
    runs-on: ubuntu-latest
    # `main` is protected by a repository ruleset with NO bypass actors, so
    # nothing -- not GITHUB_TOKEN, not a maintainer PAT -- can push a commit
    # straight to it. This job therefore does NOT bump or commit anything.
    #
    # The version is whatever `app/__version__.py` says on main, which means it
    # changes in a reviewed pull request like any other code. When main carries
    # a version with no matching tag, this job creates that tag. Tags are not
    # covered by the branch ruleset, so pushing one is allowed.
    #
    # The ref guard stays: without it a workflow_dispatch against a feature
    # branch could tag and publish unmerged code as a release.
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      changed: ${{ steps.release.outputs.changed }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Tag this version if it is new
        id: release
        run: |
          set -euo pipefail
          VERSION=$(python -c "from app.__version__ import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version on main: $VERSION"

          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists; nothing to release."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag -a "v${VERSION}" -m "Release v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Tagged v${VERSION}"

  publish:
    name: Publish Release
    needs: [ verify, tag-release ]
    if: needs.tag-release.outputs.changed == 'true'
    runs-on: ubuntu-latest
    # DOCKERHUB_USERNAME / DOCKERHUB_TOKEN are ENVIRONMENT secrets on
    # "production", not repository secrets. A job that does not declare the
    # environment cannot see them: `secrets.DOCKERHUB_USERNAME` would resolve
    # to an empty string and docker/login-action would fail with a confusing
    # auth error rather than a missing-secret one.
    environment: production
    permissions:
      contents: write
      packages: write
      id-token: write   # required for keyless cosign signing
    env:
      VERSION: ${{ needs.tag-release.outputs.version }}
      TAG: ${{ needs.tag-release.outputs.tag }}
    steps:
      # OCI repository names must be lowercase, but GITHUB_REPOSITORY keeps the
      # owner's casing (e.g. an org named "HouseofLoops"). metadata-action
      # lowercases on its own; cosign does not, and would reject the reference
      # after the images were already pushed. Derive the GHCR path once.
      - name: Resolve GHCR image name
        run: echo "GHCR_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Check out the TAG the bump job just pushed, not the pre-bump SHA that
      # triggered this run - otherwise the published image would not contain the
      # version it claims.
      - name: Checkout the tagged commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag-release.outputs.tag }}
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ secrets.DOCKERHUB_USERNAME }}/headwater
            ${{ env.GHCR_IMAGE }}
          tags: |
            type=raw,value=${{ env.VERSION }}
            type=raw,value=latest
          # metadata-action derives org.opencontainers.image.description from the
          # GitHub repository description, and its labels override the Dockerfile's
          # LABELs. The repo description was empty when 2.1.0 was built, so that
          # image shipped with an empty description despite the Dockerfile setting
          # one. Pin it here so the label never depends on a mutable GitHub field.
          labels: |
            org.opencontainers.image.description=One self-hosted API for Google Maps, News, Trends and Autocomplete, plus YouTube transcripts. Normalised JSON, no per-call vendor pricing, runs in Docker.

      # sbom and provenance are attestations attached to the image in the
      # registry, not files in the build. Without them `docker scout` reports
      # "Required supply chain attestations missing" and has to pull and
      # analyse the whole image to say anything about it; with them it reads
      # the SBOM directly, and a consumer can verify how the image was built
      # rather than taking the tag's word for it.
      #
      # provenance mode=max records the full build: the Dockerfile, the build
      # arguments and the source commit, rather than just the fact that a build
      # happened.
      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          # Only VCS_REF. metadata-action already emits
          # org.opencontainers.image.created and .revision in its labels, and
          # labels passed here override Dockerfile LABELs, so a BUILD_DATE
          # build-arg would be redundant - and metadata-action exposes no
          # `created` output to read it from anyway.
          build-args: |
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # cosign v3 signs in the Sigstore bundle format and stores signatures and
      # attestations as OCI 1.1 referrers (or the `sha256-<digest>` fallback tag
      # where a registry has no referrers API). Verifiers need cosign >= 3;
      # cosign 2.x cannot find them. Releases up to 2.2.0 were signed with 2.x.
      # Pinned rather than taking the installer default, so a cosign release
      # never changes the signature format as a side effect.
      - name: Install Cosign
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: v3.1.3

      # Sign by DIGEST, not by tag. Signing a mutable tag signs whatever that
      # tag pointed at when cosign resolved it; the digest is what the build
      # actually produced and is what `cosign verify` should be pinned to.
      - name: Sign images (keyless, Sigstore)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          cosign sign --yes "${DOCKERHUB_USER}/headwater@${DIGEST}"
          cosign sign --yes "${GHCR_IMAGE}@${DIGEST}"

      - name: Install Syft
        id: syft
        uses: anchore/sbom-action/download-syft@v0

      # --type spdxjson, not spdx: syft emits SPDX *JSON*, and cosign's `spdx`
      # type means SPDX tag-value text, which it embeds as one string. Releases
      # up to 2.2.0 carried the SBOM that way; cosign 3's bundle signing rejects
      # a non-object predicate ("invalid attestation: decoding json"). Same
      # predicate type URI (https://spdx.dev/Document) either way.
      - name: Generate and attest SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SYFT: ${{ steps.syft.outputs.cmd }}
        run: |
          set -euo pipefail
          "$SYFT" "${DOCKERHUB_USER}/headwater@${DIGEST}" -o spdx-json > sbom.json
          cosign attest --yes --predicate sbom.json --type spdxjson \
            "${DOCKERHUB_USER}/headwater@${DIGEST}"
          cosign attest --yes --predicate sbom.json --type spdxjson \
            "${GHCR_IMAGE}@${DIGEST}"

      # Prove the release is verifiable the way users will verify it, before
      # the GitHub release is published. Both registries, signature and SBOM
      # attestation, pinned to this workflow's own OIDC identity. A signing or
      # storage problem fails here instead of shipping unverifiable images.
      - name: Verify signatures and SBOM attestation
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          IDENTITY="${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}"
          ISSUER="https://token.actions.githubusercontent.com"
          for IMAGE in "${DOCKERHUB_USER}/headwater@${DIGEST}" "${GHCR_IMAGE}@${DIGEST}"; do
            echo "::group::verify ${IMAGE}"
            cosign verify "${IMAGE}" \
              --certificate-identity "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" > /dev/null
            cosign verify-attestation "${IMAGE}" --type spdxjson \
              --certificate-identity "${IDENTITY}" --certificate-oidc-issuer "${ISSUER}" > /dev/null
            echo "::endgroup::"
            echo "Verified signature and SBOM attestation: ${IMAGE}"
          done

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: ignore

      # Commit subjects are untrusted input. They are written to a file with a
      # heredoc rather than interpolated into a shell command.
      - name: Generate release notes
        id: notes
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            git log --pretty=format:'- %s' "${PREV_TAG}..${TAG}" > changes.txt
          else
            git log --pretty=format:'- %s' -20 > changes.txt
          fi

          {
            echo "## Release ${TAG}"
            echo ""
            echo "### Changes"
            echo ""
            cat changes.txt
            echo ""
            echo ""
            echo "### Images"
            echo ""
            echo "- \`${DOCKERHUB_USER}/headwater:${VERSION}\`"
            echo "- \`${GHCR_IMAGE}:${VERSION}\`"
            echo "- Digest: \`${DIGEST}\`"
            echo ""
            echo "### Verify the signature"
            echo ""
            echo '```bash'
            echo "cosign verify \\"
            echo "  --certificate-identity '${GITHUB_SERVER_URL}/${GITHUB_WORKFLOW_REF}' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com \\"
            echo "  ${GHCR_IMAGE}@${DIGEST}"
            echo '```'
          } > release-notes.md

          echo "path=release-notes.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: Release ${{ env.TAG }}
          body_path: release-notes.md
          files: sbom.json
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
