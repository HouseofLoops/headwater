# .github/workflows/update-base-image.yml
#
# This note used to say the workflow had nothing to do, because the Dockerfile
# carried a floating tag with no digest to compare against. That is no longer
# true: both FROM lines are digest-pinned.
#
# Having two pinned FROM lines is what then broke it. scripts/
# update_base_image.sh captured every matching digest rather than the first, so
# CURRENT_DIGEST held two values separated by a newline, that newline was
# interpolated into a sed "s|...|...|" expression, and sed exited with
# "unterminated `s' command". The nightly run failed that way from the moment
# pinning landed until the head -1 fix.
#
# Dependabot's `docker` ecosystem entry in .github/dependabot.yml also watches
# the base image, so this workflow is a backstop rather than the only mechanism.
name: Update Base Image

on:
  schedule:
    - cron: '0 0 * * 1'   # Weekly, Monday 00:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-base-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Warn if the Dockerfile is not digest-pinned
        run: |
          if ! grep -qE '^FROM .*@sha256:' Dockerfile; then
            echo "::warning::Dockerfile is not digest-pinned; this workflow cannot detect base image drift. Pin FROM lines to @sha256:... to enable it."
          fi

      - name: Check for base image updates
        id: check-updates
        run: |
          chmod +x ./scripts/update_base_image.sh
          if ./scripts/update_base_image.sh --check-only; then
            echo "Base image is already up-to-date"
            echo "updated=false" >> "$GITHUB_OUTPUT"
          else
            echo "Base image needs to be updated"
            echo "updated=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Update base image
        if: steps.check-updates.outputs.updated == 'true'
        run: ./scripts/update_base_image.sh

      - name: Create Pull Request
        if: steps.check-updates.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: update base image to latest digest'
          title: 'chore: update base image to latest digest'
          body: |
            This PR updates the base image in the Dockerfile to the latest digest.

            Opened automatically by the "Update Base Image" workflow.
          branch: update-base-image
          delete-branch: true
          labels: |
            dependencies
            security
